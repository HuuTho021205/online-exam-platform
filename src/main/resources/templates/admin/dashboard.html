<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(title='Trang quản trị', content=~{:: #admin-dashboard})}">
<body>
<main id="admin-dashboard" class="container py-4">
    <div class="mb-4">
        <h2 class="mb-1">Trang quản trị hệ thống</h2>
        <p class="text-muted mb-0">
            Xin chào, <strong sec:authentication="principal.fullName">Quản trị viên</strong>. Chọn phân hệ bên dưới để quản lý dữ liệu.
        </p>
    </div>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-3">
            <a th:href="@{/admin/users}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-0 border-start border-4 border-primary">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <div class="text-muted small text-uppercase fw-semibold">Người dùng</div>
                                <h3 class="fw-bold text-dark mt-1 mb-0" th:text="${totalUsers ?: 0}">0</h3>
                            </div>
                            <span class="badge bg-primary-subtle text-primary p-2 fs-5">
                                <i class="bi bi-people-fill"></i>
                            </span>
                        </div>
                        <div class="text-primary small fw-semibold">
                            Quản lý người dùng <i class="bi bi-arrow-right ms-1"></i>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
            <a th:href="@{/admin/majors}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-0 border-start border-4 border-success">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <div class="text-muted small text-uppercase fw-semibold">Ngành học</div>
                                <h3 class="fw-bold text-dark mt-1 mb-0" th:text="${totalMajors ?: 0}">0</h3>
                            </div>
                            <span class="badge bg-success-subtle text-success p-2 fs-5">
                                <i class="bi bi-diagram-3-fill"></i>
                            </span>
                        </div>
                        <div class="text-success small fw-semibold">
                            Quản lý ngành <i class="bi bi-arrow-right ms-1"></i>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <a th:href="@{/admin/classrooms}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-0 border-start border-4 border-warning">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <div class="text-muted small text-uppercase fw-semibold">Lớp học</div>
                                <h3 class="fw-bold text-dark mt-1 mb-0" th:text="${totalClassrooms ?: 0}">0</h3>
                            </div>
                            <span class="badge bg-warning-subtle text-warning p-2 fs-5">
                                <i class="bi bi-building-fill"></i>
                            </span>
                        </div>
                        <div class="text-warning-emphasis small fw-semibold">
                            Quản lý lớp học <i class="bi bi-arrow-right ms-1"></i>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <a th:href="@{/admin/subjects}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-0 border-start border-4 border-info">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <div class="text-muted small text-uppercase fw-semibold">Môn học</div>
                                <h3 class="fw-bold text-dark mt-1 mb-0" th:text="${totalSubjects ?: 0}">0</h3>
                            </div>
                            <span class="badge bg-info-subtle text-info p-2 fs-5">
                                <i class="bi bi-book-fill"></i>
                            </span>
                        </div>
                        <div class="text-info-emphasis small fw-semibold">
                            Quản lý môn học <i class="bi bi-arrow-right ms-1"></i>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>
</body>
</html>
