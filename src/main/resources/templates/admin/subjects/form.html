<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(title=${pageTitle}, content=~{:: #subject-form})}">
<head>
    <title th:text="${pageTitle}">Môn học</title>
</head>
<body>
<main id="subject-form" class="container py-4" style="max-width: 720px;">
    <div class="mb-3">
        <h2 th:text="${pageTitle}">Thêm môn học</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{${formAction}}" th:object="${subjectRequest}" method="post" novalidate>

                <div class="mb-3">
                    <label for="subjectName" class="form-label fw-semibold">
                        Tên môn học <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           id="subjectName"
                           th:field="*{subjectName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('subjectName')} ? 'is-invalid'"
                           placeholder="Nhập tên môn học (ví dụ: Toán)">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('subjectName')}"
                         th:errors="*{subjectName}">
                        Lỗi tên môn
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Lưu
                    </button>
                    <a th:href="@{/admin/subjects}" class="btn btn-secondary">
                        Quay lại
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
