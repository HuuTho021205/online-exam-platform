<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="messages">
    <div th:if="${successMessage != null}"
         class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage != null}"
         class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${warningMessage != null}"
         class="alert alert-warning alert-dismissible fade show mb-3" role="alert">
        <span th:text="${warningMessage}">Cảnh báo hệ thống!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

</body>
</html>
