<!doctype html>
<html lang="vi"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary " data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Online-Exam</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Chuyển đổi điều hướng">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/subjects}">Danh sách môn học</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/dashboard}">
                        <i class="bi bi-mortarboard me-1"></i>Góc sinh viên
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('LECTURER')">
                    <a class="nav-link" th:href="@{/lecturer/dashboard}">
                        <i class="bi bi-mortarboard me-1"></i>Khu vực giảng viên
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-mortarboard me-1"></i>Quản trị hệ thống
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                </li>

                <li class="nav-item d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                        <span class="text-light small">
                        <i class="bi bi-person-circle me-1"></i>
                        Xin chào, <strong sec:authentication="name">user</strong>
                        <span class="badge bg-secondary ms-1" sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('LECTURER')">Giảng viên</span>
                        <span class="badge bg-info text-dark ms-1" sec:authorize="hasRole('STUDENT')">Sinh viên</span>
                    </span>

                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                        </button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>
</body>
</html>
